<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Учёт ИТ-активов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1F3A5F; --primary-h:#2E5A8A; --bg:#F5F7FA; --surface:#FFFFFF; --text:#1F2933; --muted:#6B7280;
  --border:#E5E7EB; --success:#2F855A; --warn:#B7791F; --danger:#C53030; --neutral:#4A5568;
  --success-bg:#E8F3EC; --warn-bg:#FBF3E2; --danger-bg:#FCECEC; --neutral-bg:#EDF0F4; --primary-bg:#E8EEF6;
  --hover:#F3F6FA; --r:6px; --r-sm:4px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.5 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h2{font-size:20px;font-weight:600;margin:0}
h3{font-size:16px;font-weight:600;margin:0}
h4{font-size:14px;font-weight:600;margin:24px 0 8px}
a{color:var(--primary)}
.mono,.num,td,th{font-variant-numeric:tabular-nums}
.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:13px;letter-spacing:.02em}
.muted{color:var(--muted)}
.ic{flex:none;vertical-align:-3px}
:focus-visible{outline:2px solid var(--primary-h);outline-offset:2px}

/* ---------- Header ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar-in{max-width:1440px;margin:0 auto;padding:0 24px;height:56px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;color:var(--text);text-decoration:none;white-space:nowrap}
.logo{width:32px;height:32px;border-radius:var(--r);background:var(--primary);color:#fff;display:grid;place-items:center}
.nav{display:flex;gap:4px}
.nav a,.nav button{font:inherit;font-weight:500;color:var(--neutral);text-decoration:none;padding:8px 12px;border-radius:var(--r);border:0;background:none;cursor:pointer}
.nav a:hover,.nav button:hover{background:var(--hover);color:var(--primary)}
.gsearch{position:relative;margin-left:auto;width:320px;max-width:100%}
.gsearch .ic{position:absolute;left:10px;top:10px;color:var(--muted)}
.gsearch input{width:100%;padding-left:32px}
.gres{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 8px 24px rgba(31,41,51,.12);z-index:40;max-height:360px;overflow:auto}
.gres button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;font:inherit;cursor:pointer;border-bottom:1px solid var(--border)}
.gres button:last-child{border-bottom:0}
.gres button:hover,.gres button:focus{background:var(--hover)}
.gres .empty{padding:12px;color:var(--muted)}
.profile{display:flex;align-items:center;gap:8px;white-space:nowrap}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-bg);color:var(--primary);display:grid;place-items:center;font-weight:600;font-size:12px}
.pname{font-weight:500;font-size:13px}

/* ---------- Layout ---------- */
.wrap{max-width:1440px;margin:0 auto;padding:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px;margin-top:24px;scroll-margin-top:72px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.sec-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Controls ---------- */
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 10px;min-height:36px}
textarea{resize:vertical;min-height:72px}
input:hover,select:hover,textarea:hover{border-color:#CBD2DA}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary-h);box-shadow:0 0 0 3px rgba(46,90,138,.15)}
input[aria-invalid=true],select[aria-invalid=true],textarea[aria-invalid=true]{border-color:var(--danger)}
input:disabled{background:var(--bg);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:500;border-radius:var(--r-sm);padding:7px 14px;min-height:36px;cursor:pointer;border:1px solid transparent;white-space:nowrap;text-decoration:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-h)}
.btn-secondary{background:var(--surface);color:var(--primary);border-color:#C9D3DF}
.btn-secondary:hover{border-color:var(--primary-h);background:var(--hover)}
.btn-text{background:none;color:var(--primary);padding:7px 8px}
.btn-text:hover{background:var(--hover)}
.btn-danger{background:var(--surface);color:var(--danger);border-color:#EBC4C4}
.btn-danger:hover{background:var(--danger-bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{min-height:32px;padding:5px 10px;font-size:13px}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:var(--r-sm);border:0;background:none;color:var(--neutral);cursor:pointer}
.icon-btn:hover{background:var(--hover);color:var(--primary)}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.chk input{min-height:0;width:16px;height:16px;margin:0;accent-color:var(--primary)}

/* ---------- KPI ---------- */
.kpi{display:grid;gap:16px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kpi-row.warn{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.kpi-card{font:inherit;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--text)}
.kpi-card:hover{border-color:#C9D3DF}
.kpi-card.active{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.kpi-card .k-label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi-card .k-val{font-size:24px;font-weight:600;line-height:1.2}
.kpi-card .dot{width:8px;height:8px;border-radius:50%;flex:none}
.kpi-card.alert{flex-direction:row;align-items:center;gap:12px}
.kpi-card.alert .k-ic{width:36px;height:36px;border-radius:var(--r);display:grid;place-items:center;background:var(--warn-bg);color:var(--warn);flex:none}
.kpi-card.alert.zero .k-ic{background:var(--neutral-bg);color:var(--neutral)}
.kpi-card.alert .k-val{font-size:20px}

/* ---------- Toolbar & filters ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .search{flex:1 1 280px;position:relative}
.toolbar .search input{width:100%;padding-left:32px}
.toolbar .search .ic{position:absolute;left:10px;top:10px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{max-width:200px}
.filt-toggle{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--primary-bg);color:var(--primary);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px;font-weight:500}
.chip button{border:0;background:none;color:inherit;cursor:pointer;display:grid;place-items:center;width:20px;height:20px;border-radius:50%}
.chip button:hover{background:rgba(31,58,95,.1)}
.reg-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:16px 0 8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--primary-bg);border-radius:var(--r);padding:8px 12px;margin-bottom:8px}
.bulk b{margin-right:8px}

/* ---------- Tables ---------- */
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--r)}
.reg-wrap{max-height:640px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;z-index:2;background:#F9FAFB;text-align:left;font-weight:600;font-size:12px;color:var(--neutral);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr[data-open]{cursor:pointer}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl .num{text-align:right;white-space:nowrap}
.tbl .r{text-align:right}
.tbl .c-chk{width:36px;padding-right:0}
.tbl .c-act{width:44px;padding:4px 8px;text-align:right}
.tbl td.c-name{min-width:220px}
.th-sort{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.th-sort:hover{color:var(--primary)}
.th-sort .arr{opacity:.35}
.th-sort[data-active] .arr{opacity:1;color:var(--primary)}
.sub{font-size:12px;color:var(--muted)}
.empty{padding:32px;text-align:center;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-success{background:var(--success-bg);color:var(--success)}
.b-warn{background:var(--warn-bg);color:#8A5A12}
.b-danger{background:var(--danger-bg);color:var(--danger)}
.b-neutral{background:var(--neutral-bg);color:var(--neutral)}
.b-accent{background:var(--primary-bg);color:var(--primary)}
.b-muted{background:#F1F2F4;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:0 6px;border-radius:var(--r-sm);margin-left:4px;white-space:nowrap}
.tag-warn{background:var(--warn-bg);color:#8A5A12}
.tag-danger{background:var(--danger-bg);color:var(--danger)}
.nd{background:#FEF3C7;color:#8A5A12;padding:1px 6px;border-radius:var(--r-sm);font-size:12px;font-weight:500;white-space:nowrap}
.amort0{color:var(--muted)}
.amort6{color:var(--warn);font-weight:500}
.dotted{border-bottom:1px dotted var(--muted);cursor:help}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap;font-size:13px}
.pager .pg{display:flex;align-items:center;gap:8px}
.reg-cards{display:none;gap:8px}
.a-card{border:1px solid var(--border);border-radius:var(--r);padding:12px;display:grid;gap:4px;cursor:pointer;background:var(--surface)}
.a-card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.a-card .nm{font-weight:500}

/* ---------- Menu ---------- */
.menu{position:fixed;z-index:60;min-width:220px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 8px 24px rgba(31,41,51,.14);padding:4px}
.menu button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;font:inherit;padding:8px 12px;border-radius:var(--r-sm);cursor:pointer;color:var(--text)}
.menu button:hover,.menu button:focus{background:var(--hover);outline:none}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.menu .mh{font-size:11px;color:var(--muted);padding:4px 12px;text-transform:uppercase;letter-spacing:.04em}

/* ---------- Drawer ---------- */
.overlay{position:fixed;inset:0;background:rgba(31,41,51,.28);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:100%;background:var(--surface);z-index:45;display:flex;flex-direction:column;border-left:1px solid var(--border);box-shadow:-8px 0 24px rgba(31,41,51,.12)}
.dr-h{display:flex;justify-content:space-between;gap:16px;padding:16px 24px;border-bottom:1px solid var(--border)}
.dr-h h3{margin:4px 0 8px}
.dr-inv{color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);padding:0 24px;overflow-x:auto}
.tabs button{font:inherit;font-weight:500;border:0;background:none;padding:10px 12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--primary);border-bottom-color:var(--primary)}
.dr-b{flex:1;overflow:auto;padding:24px}
.dr-f{border-top:1px solid var(--border);padding:12px 24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dl{display:grid;grid-template-columns:200px 1fr;gap:8px 16px;margin:0 0 8px}
.dl dt{color:var(--muted);font-size:13px}
.dl dd{margin:0}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 20px 24px;border-left:1px solid var(--border);margin-left:6px}
.tl li:last-child{border-left-color:transparent}
.tl li::before{content:"";position:absolute;left:-6px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--primary)}
.tl li.storno::before{border-color:var(--danger)}
.tl li.audit::before{border-color:#CBD2DA}
.tl .t-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl .t-date{font-weight:600}
.tl .t-line{font-size:13px;color:var(--neutral);margin-top:2px}
.tl .t-meta{font-size:12px;color:var(--muted);margin-top:4px}
.tl .cancelled .t-op{text-decoration:line-through;color:var(--muted)}

/* ---------- Modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(31,41,51,.36);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:var(--r);width:560px;max-width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(31,41,51,.2)}
.modal.wide{width:880px}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:16px 24px;border-bottom:1px solid var(--border)}
.modal-sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.6}
.modal-b{padding:24px;overflow:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 24px;border-top:1px solid var(--border);flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid.one{grid-template-columns:1fr}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld>label{font-size:12px;font-weight:500;color:var(--neutral)}
.fld .req{color:var(--danger);margin-left:2px}
.ferr{font-size:12px;color:var(--danger);min-height:0}
.ferr:empty{display:none}
.hint{font-size:12px;color:var(--muted)}
.op-flow{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.note{background:var(--bg);border-radius:var(--r);padding:12px;font-size:13px;color:var(--neutral);margin-bottom:16px}
.note.warn{background:var(--warn-bg);color:#6B470E}

/* ---------- Report ---------- */
.rp-controls{display:grid;gap:12px}
.rp-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.rp-row .lbl{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--neutral)}
.presets{display:flex;gap:4px;flex-wrap:wrap}
.presets button{font:inherit;font-size:13px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--neutral);min-height:32px}
.presets button:hover{border-color:var(--primary-h);color:var(--primary)}
.presets button[aria-pressed=true]{background:var(--primary-bg);border-color:var(--primary-bg);color:var(--primary);font-weight:500}
.rp-row select{max-width:220px}
.msel{position:relative}
.msel-btn{max-width:260px;justify-content:space-between;color:var(--text);font-weight:400}
.msel-btn span{overflow:hidden;text-overflow:ellipsis}
.msel-panel{position:absolute;top:calc(100% + 4px);left:0;z-index:20;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 8px 24px rgba(31,41,51,.12);padding:8px;min-width:260px;max-height:320px;overflow:auto;display:grid;gap:2px}
.msel-panel .chk{padding:6px 8px;border-radius:var(--r-sm);font-size:13px}
.msel-panel .chk:hover{background:var(--hover)}
.msel-foot{display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:4px;margin-top:4px}
.rp-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:24px 0 8px}
.rp-meta{font-size:13px;color:var(--muted)}
.rp-exports{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--danger);font-size:13px}
.err:empty{display:none}
.rp-wrap{max-height:70vh}
.rp-wrap .tbl td{white-space:nowrap}
.rp-wrap .tbl td.wrap{white-space:normal;min-width:200px}
.tbl tr.cancelled td{color:var(--muted)}
.empty-box{border:1px dashed #CBD2DA;border-radius:var(--r);padding:32px;text-align:center;color:var(--muted)}
.totals{margin-top:24px;border-top:1px solid var(--border);padding-top:16px}
.tot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.tot{border:1px solid var(--border);border-radius:var(--r);padding:12px 16px}
.tot .t-l{font-size:12px;color:var(--muted)}
.tot .t-v{font-size:18px;font-weight:600}
.tot .t-s{font-size:12px;color:var(--neutral)}
.tot-check{margin-top:8px;font-size:13px;display:flex;gap:6px;align-items:center}
.tot-check.ok{color:var(--success)}
.tot-check.bad{color:var(--danger)}

/* ---------- Directories ---------- */
.dict-add{display:flex;gap:8px;margin:16px 0}
.dict-add input{flex:1}
.inline-inp{width:100%;border-color:transparent;background:transparent}
.inline-inp:hover{border-color:var(--border)}
.emp-form{border:1px solid var(--border);border-radius:var(--r);padding:16px;margin:16px 0}
.row-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.set-block{border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-top:16px}
.set-block p{margin:4px 0 12px;color:var(--muted);font-size:13px}

/* ---------- Toasts ---------- */
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:70;display:grid;gap:8px}
.toast{background:var(--text);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13px;box-shadow:0 8px 24px rgba(31,41,51,.2);display:flex;gap:8px;align-items:center}
.toast.err{background:var(--danger)}

/* ---------- Printable document (print & PDF) ---------- */
#printArea{display:none}
.print-doc{font:11px/1.4 Inter,Arial,sans-serif;color:#111;background:#fff}
.print-doc .pd-org{font-weight:600;font-size:13px}
.print-doc h1{font-size:16px;margin:8px 0 4px}
.print-doc .pd-meta{color:#444;margin-bottom:12px}
.print-doc table{width:100%;border-collapse:collapse}
.print-doc th,.print-doc td{border:1px solid #9CA3AF;padding:4px 5px;text-align:left;vertical-align:top}
.print-doc th{background:#EEF1F5;font-weight:600}
.print-doc tr{page-break-inside:avoid}
.print-doc .pd-tot{margin-top:12px;border-collapse:collapse;width:auto;min-width:50%}
.print-doc .pd-empty{padding:16px;border:1px dashed #999;text-align:center}
.print-doc .pd-sign{margin-top:32px;display:flex;gap:48px;flex-wrap:wrap}
.print-doc .pd-sign span{display:inline-block;border-bottom:1px solid #111;min-width:200px;margin-left:8px}
.pdf-doc{width:1060px;padding:8px}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{background:#fff}
  body.print-mode>*:not(#printArea){display:none!important}
  body.print-mode #printArea{display:block}
  .topbar,.drawer,.overlay,.modal-back,.toasts,.menu{display:none!important}
}

/* ---------- Responsive ---------- */
@media (max-width:1279px){
  .filt-toggle{display:inline-flex}
  .filters{display:none;width:100%;padding:8px 0}
  .filters.open{display:flex}
  .filters select{flex:1 1 180px;max-width:none}
  .pname{display:none}
}
@media (max-width:900px){
  .topbar-in{height:auto;flex-wrap:wrap;padding:8px 16px;gap:8px 16px}
  .gsearch{order:3;width:100%}
  .card{scroll-margin-top:120px}
}
@media (max-width:767px){
  .wrap{padding:16px}
  .card{padding:16px;margin-top:16px}
  .reg-wrap{display:none}
  .reg-cards{display:grid}
  .nav a,.nav button{padding:6px 8px}
  .form-grid{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr;gap:0 0}
  .dl dd{margin-bottom:8px}
  .drawer{width:100%}
  .dr-h,.dr-b,.dr-f{padding-left:16px;padding-right:16px}
  .tabs{padding:0 16px}
  .modal-b{padding:16px}
  .rp-row select,.rp-row .lbl,.rp-row .msel,.rp-row .msel-btn{flex:1 1 100%;max-width:none;width:100%}
  .kpi-card .k-val{font-size:20px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">

<script>
'use strict';
/* =====================================================================
   Учёт ИТ-активов — одностраничное приложение (реализация PRD v1.3)
   Данные хранятся в localStorage браузера.
   ===================================================================== */
const LS_KEY = 'itam_v1';
const USER = 'Менеджер по активам';
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const H2P_URL = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';

/* ---------- Утилиты ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const TODAY = toISO(new Date());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return toISO(d); };
const addMonths = (s, n) => {
  const d = parseISO(s), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return toISO(d);
};
const firstOfNextMonth = s => { const d = parseISO(s); return toISO(new Date(d.getFullYear(), d.getMonth() + 1, 1)); };
const monthsFull = (a, b) => {
  const [ay, am, ad] = a.split('-').map(Number), [by, bm, bd] = b.split('-').map(Number);
  let m = (by - ay) * 12 + (bm - am); if (bd < ad) m--; return m;
};
const fmtD = s => s ? s.split('-').reverse().join('.') : '—';
const NF = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtMoney = n => (n == null || n === '' || isNaN(+n)) ? '—' : NF.format(+n) + ' ₸';
const fmtMonths = n => { if (n < 12) return `${n} мес.`; const y = Math.floor(n / 12), m = n % 12; return `${n} мес. (${y} г.${m ? ' ' + m + ' мес.' : ''})`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
const nowStamp = () => { const d = new Date(); return `${toISO(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const fmtStamp = s => s ? `${fmtD(s.slice(0, 10))} ${s.slice(11, 16)}` : '';

const ICONS = {
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  chevL: '<path d="m15 18-6-6 6-6"/>', chevR: '<path d="m9 18 6-6-6-6"/>', chevD: '<path d="m6 9 6 6 6-6"/>',
  alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
  userX: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m17 8 5 5"/><path d="m22 8-5 5"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  sheet: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h2"/><path d="M14 13h2"/><path d="M8 17h2"/><path d="M14 17h2"/>',
  file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  printer: '<path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
  filter: '<path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/>',
  undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  laptop: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  sort: '<path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/>',
  columns: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/>'
};
const icon = (n, s = 16) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* ---------- Справочные константы ---------- */
const STATUSES = {
  received: { label: 'Поступил', cls: 'b-accent', color: '#1F3A5F' },
  stock: { label: 'На складе', cls: 'b-neutral', color: '#4A5568' },
  use: { label: 'В эксплуатации', cls: 'b-success', color: '#2F855A' },
  repair: { label: 'В ремонте', cls: 'b-warn', color: '#B7791F' },
  reserve: { label: 'В резерве', cls: 'b-neutral', color: '#8592A3' },
  writtenoff: { label: 'Списан', cls: 'b-danger', color: '#C53030' },
  disposed: { label: 'Утилизирован', cls: 'b-muted', color: '#9CA3AF' }
};
const STATUS_ORDER = Object.keys(STATUSES);
const ON_BOOKS = ['stock', 'use', 'repair', 'reserve'];
const CLOSED = ['writtenoff', 'disposed'];
const OPS = {
  register: { label: 'Регистрация поступления', from: [] },
  accept: { label: 'Принятие к учёту', from: ['received'], to: 'stock' },
  issue: { label: 'Выдача', from: ['stock', 'reserve'], to: 'use' },
  move: { label: 'Перемещение', from: ['use'], to: 'use' },
  return: { label: 'Возврат на склад', from: ['use', 'repair'], to: 'stock' },
  repair: { label: 'Отправка в ремонт', from: ['use', 'stock'], to: 'repair' },
  fromRepair: { label: 'Возврат из ремонта', from: ['repair'], to: null },
  reserve: { label: 'Перевод в резерв', from: ['stock', 'use'], to: 'reserve' },
  writeoff: { label: 'Списание', from: ['received', 'stock', 'use', 'repair', 'reserve'], to: 'writtenoff' },
  dispose: { label: 'Утилизация', from: ['writtenoff'], to: 'disposed' },
  storno: { label: 'Сторно', from: [] }
};
const USER_OPS = ['accept', 'issue', 'move', 'return', 'repair', 'fromRepair', 'reserve', 'writeoff', 'dispose'];
const INTERNAL = ['issue', 'move', 'return', 'repair', 'fromRepair', 'reserve'];
const allowedOps = a => USER_OPS.filter(o => OPS[o].from.includes(a.status));
const badge = s => s ? `<span class="badge ${STATUSES[s].cls}">${STATUSES[s].label}</span>` : '—';

/* ---------- Хранилище ---------- */
let S = null, CACHE = null;
function load() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { S = JSON.parse(raw); if (S && Array.isArray(S.assets)) { S.audit = S.audit || []; return; } } } catch (e) { }
  seed(); save();
}
function save() { CACHE = null; try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { } }

function idx() {
  if (CACHE) return CACHE;
  const c = {
    emp: new Map(S.employees.map(x => [x.id, x])), loc: new Map(S.locations.map(x => [x.id, x])),
    cat: new Map(S.categories.map(x => [x.id, x])), dept: new Map(S.departments.map(x => [x.id, x])),
    reason: new Map(S.reasons.map(x => [x.id, x])), asset: new Map(S.assets.map(x => [x.id, x])),
    stornoed: new Set(), mov: new Map(), eff: new Map()
  };
  for (const m of S.movements) if (m.storno_of) c.stornoed.add(m.storno_of);
  c.sorted = [...S.movements].sort((a, b) => a.operation_date < b.operation_date ? -1 : a.operation_date > b.operation_date ? 1 : a.seq - b.seq);
  for (const m of c.sorted) {
    if (!c.mov.has(m.asset_id)) { c.mov.set(m.asset_id, []); c.eff.set(m.asset_id, []); }
    c.mov.get(m.asset_id).push(m);
    if (m.operation_type !== 'storno' && !c.stornoed.has(m.id)) c.eff.get(m.asset_id).push(m);
  }
  CACHE = c; return c;
}
const emp = id => idx().emp.get(id);
const empFio = id => { const e = emp(id); return e ? e.fio : '—'; };
const empShort = id => { const e = emp(id); if (!e) return '—'; const [f, i, o] = e.fio.split(' '); return `${f}${i ? ' ' + i[0] + '.' : ''}${o ? ' ' + o[0] + '.' : ''}`; };
const empFull = id => { const e = emp(id); return e ? `${e.fio}${e.position ? ', ' + e.position : ''}` : '—'; };
const locName = id => { const l = idx().loc.get(id); return l ? l.name : '—'; };
const catName = id => { const l = idx().cat.get(id); return l ? l.name : '—'; };
const deptName = id => { const l = idx().dept.get(id); return l ? l.name : '—'; };
const whMol = () => (S.employees.find(e => e.active && e.isMol && e.dept === 'd5') || S.employees.find(e => e.active && e.isMol) || {}).id || '';
const whLoc = () => (S.locations[0] || {}).id || '';
const effMovs = a => idx().eff.get(a.id) || [];
const lastEffDate = a => { const e = effMovs(a); return e.length ? e[e.length - 1].operation_date : null; };
const regDate = a => { const r = (idx().mov.get(a.id) || []).find(m => m.operation_type === 'register'); return r ? r.operation_date : null; };
function statusAt(id, d) { let s = null; for (const m of (idx().eff.get(id) || [])) { if (m.operation_date > d) break; s = m.status_to; } return s; }
function nextInv() { let mx = 0; for (const a of S.assets) { const n = parseInt(a.inventory_number, 10); if (n > mx) mx = n; } return String(mx + 1).padStart(8, '0'); }
function invError(inv, selfId) {
  if (!/^\d{8}$/.test(inv || '')) return 'Ровно 8 цифр, например 00000123';
  if (S.assets.some(x => x.inventory_number === inv && x.id !== selfId)) return 'Инвентарный номер уже используется';
  return '';
}

/* ---------- Операции жизненного цикла ---------- */
const snapshot = a => ({
  status: a.status, responsible_person: a.responsible_person, location: a.location, inventory_number: a.inventory_number,
  accounting_date: a.accounting_date, depreciation_start_date: a.depreciation_start_date, useful_life_months: a.useful_life_months
});
function applyOp(a, op, v, createdAt) {
  const m = {
    id: uid(), seq: ++S.seq, asset_id: a.id, operation_type: op, operation_date: v.date,
    status_from: op === 'register' ? null : a.status, status_to: null,
    mol_from: a.responsible_person || null, location_from: a.location || null,
    document_ref: '', comment: '', created_by: USER, created_at: createdAt || nowStamp(), prev: snapshot(a)
  };
  let to = OPS[op].to;
  switch (op) {
    case 'register': to = 'received'; m.document_ref = v.doc || ''; m.comment = 'Регистрация поступившего оборудования'; break;
    case 'accept':
      a.inventory_number = v.inv; a.accounting_date = v.date; a.responsible_person = v.mol; if (v.loc) a.location = v.loc;
      if (v.spi) a.useful_life_months = +v.spi; a.depreciation_start_date = firstOfNextMonth(v.date); a.depr_start_reason = '';
      m.document_ref = v.doc; break;
    case 'issue': a.responsible_person = v.mol; a.location = v.loc; m.document_ref = v.doc || ''; break;
    case 'move': if (v.mol) a.responsible_person = v.mol; if (v.loc) a.location = v.loc; m.document_ref = v.doc; break;
    case 'return': a.responsible_person = v.mol; if (v.loc) a.location = v.loc; m.comment = 'Состояние: ' + v.cond; break;
    case 'repair': m.comment = `Исполнитель: ${v.service}. Неисправность: ${v.fault}`; break;
    case 'fromRepair': to = v.target; if (v.mol) a.responsible_person = v.mol; if (v.target === 'stock' && v.loc) a.location = v.loc; m.comment = 'Результат ремонта: ' + v.result; break;
    case 'reserve': m.comment = 'Причина: ' + v.reason; break;
    case 'writeoff': { const r = S.reasons.find(x => x.id === v.reason); m.reason_id = v.reason; m.document_ref = 'Акт списания № ' + v.act; m.comment = 'Причина: ' + (r ? r.name : ''); break; }
    case 'dispose': m.document_ref = 'Акт утилизации № ' + v.act; m.comment = 'Организация-утилизатор: ' + v.org; break;
  }
  a.status = to; m.status_to = to; m.mol_to = a.responsible_person || null; m.location_to = a.location || null;
  S.movements.push(m); CACHE = null;
  return m;
}
function stornoTarget(a) { const e = effMovs(a); const last = e[e.length - 1]; return last && last.operation_type !== 'register' ? last : null; }
function doStorno(a, comment) {
  const t = stornoTarget(a); if (!t) return;
  const cur = snapshot(a); Object.assign(a, t.prev);
  S.movements.push({
    id: uid(), seq: ++S.seq, asset_id: a.id, operation_type: 'storno', operation_date: TODAY,
    status_from: cur.status, status_to: a.status, mol_from: cur.responsible_person || null, mol_to: a.responsible_person || null,
    location_from: cur.location || null, location_to: a.location || null, document_ref: '', storno_of: t.id,
    comment: `Сторно операции «${OPS[t.operation_type].label}» от ${fmtD(t.operation_date)}. ${comment}`, created_by: USER, created_at: nowStamp()
  });
  CACHE = null;
}

/* ---------- Амортизация (п. 7.3.1) ---------- */
function depr(a, dTo) {
  if (a.low_value) return { kind: 'na' };
  const spi = +a.useful_life_months, cost = (a.cost === '' || a.cost == null) ? NaN : +a.cost;
  if (!spi || !(cost > 0)) return { kind: 'missing' };
  const eff = effMovs(a);
  const wo = eff.find(m => m.operation_type === 'writeoff' && m.operation_date <= dTo);
  const calcTo = wo ? wo.operation_date : dTo;
  const kind = wo ? 'off' : 'ok', offDate = wo ? wo.operation_date : null;
  const rv = Math.min(+a.residual_value || 0, cost);
  if (!a.accounting_date || a.accounting_date > calcTo) return { kind, remain: spi, residual: cost, elapsed: 0, offDate };
  const start = a.depreciation_start_date || firstOfNextMonth(a.accounting_date);
  const endX = addDays(calcTo, 1);
  let elapsed = Math.max(0, monthsFull(start, endX));
  // Консервация свыше 3 месяцев продлевает СПИ на время нахождения в резерве
  const cut = (s, e) => { if (addMonths(s, 3) < e) { const s2 = s > start ? s : start, e2 = e < endX ? e : endX; if (e2 > s2) elapsed -= Math.max(0, monthsFull(s2, e2)); } };
  let rs = null;
  for (const m of eff) {
    if (m.operation_date > calcTo) break;
    if (m.status_to === 'reserve' && m.status_from !== 'reserve') rs = m.operation_date;
    else if (rs && m.status_from === 'reserve' && m.status_to !== 'reserve') { cut(rs, m.operation_date); rs = null; }
  }
  if (rs) cut(rs, endX);
  elapsed = Math.max(0, elapsed);
  const used = Math.min(elapsed, spi);
  return { kind, remain: Math.max(0, spi - elapsed), residual: Math.max(rv, cost - (cost - rv) / spi * used), elapsed, offDate };
}
function remainCell(d) {
  if (d.kind === 'na') return { h: '<span class="dotted" title="Малоценное оборудование — амортизация не рассчитывается">—</span>', t: '—' };

}
function residCell(d) {

function openModal({ title, sub, body, foot, wide, onClose }) {
  const back = document.createElement('div'); back.className = 'modal-back';
  back.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="mt${S.seq}"><div class="modal-h"><div><h3 id="mt${S.seq}">${esc(title)}</h3>${sub ? `<div class="modal-sub">${sub}</div>` : ''}</div><button class="icon-btn" type="button" data-x aria-label="Закрыть">${icon('x', 18)}</button></div><div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
  const prev = document.activeElement;
  const close = () => { back.remove(); if (prev && prev.focus && document.contains(prev)) prev.focus(); onClose && onClose(); };
  back.close = close;
  back.addEventListener('mousedown', e => { if (e.target === back) close(); });
  back.querySelectorAll('[data-x]').forEach(b => b.addEventListener('click', close));
  $('#modalRoot').appendChild(back);
  setTimeout(() => { const f = back.querySelector('.modal-b input:not([type=checkbox]):not(:disabled), .modal-b select, .modal-b textarea'); f && f.focus(); }, 30);

}

    case 'reason': inp = `<select id="${id}" name="${f.k}" ${dis}>${opt(S.reasons.map(x => [x.id, x.name]), v, '— выберите —')}</select>`; break;
    case 'select': inp = `<select id="${id}" name="${f.k}" ${dis}>${opt(f.options.map(o => Array.isArray(o) ? o : [o, o]), v, f.empty === false ? null : '— выберите —')}</select>`; break;

];

function setPreset(p) {
  const d = parseISO(TODAY), y = d.getFullYear(), mo = d.getMonth();
  if (p === 'month') { RP.from = toISO(new Date(y, mo, 1)); RP.to = TODAY; }
  if (p === 'prev') { RP.from = toISO(new Date(y, mo - 1, 1)); RP.to = toISO(new Date(y, mo, 0)); }
  if (p === 'quarter') { RP.from = toISO(new Date(y, Math.floor(mo / 3) * 3, 1)); RP.to = TODAY; }
  if (p === 'year') { RP.from = toISO(new Date(y, 0, 1)); RP.to = TODAY; }
  RP.preset = p; $('#rpFrom').value = RP.from; $('#rpTo').value = RP.to;
  document.querySelectorAll('[data-preset]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.preset === p)));
}
function periodError() {
  if (!RP.from || !RP.to) return 'Укажите период: дату «с» и дату «по»';
  if (RP.from > RP.to) return 'Дата «с» не может быть позже даты «по»';
  if (RP.to > TODAY) return 'Период не может заканчиваться в будущем';
  return '';
}
function buildReport() {
  const c = idx(), rows = [], dc = new Map();
  const dOf = a => { if (!dc.has(a.id)) dc.set(a.id, depr(a, RP.to)); return dc.get(a.id); };
  for (const m of c.sorted) {
    if (m.operation_date < RP.from || m.operation_date > RP.to) continue;
    const a = c.asset.get(m.asset_id); if (!a) continue;
    if (RP.types.size && !RP.types.has(m.operation_type)) continue;
    if (RP.mols.size && !RP.mols.has(m.mol_to) && !RP.mols.has(m.mol_from)) continue;
    if (RP.dept) { const e = c.emp.get(m.mol_to); if (!e || e.dept !== RP.dept) continue; }
    if (RP.loc && m.location_to !== RP.loc && m.location_from !== RP.loc) continue;
    if (RP.cat && a.category !== RP.cat) continue;
    const d = dOf(a);
    if (RP.depr !== 'all') {
      if (d.kind !== 'ok') continue;
      if (RP.depr === 'le6' && !(d.remain > 0 && d.remain <= 6)) continue;
      if (RP.depr === 'le12' && !(d.remain > 0 && d.remain <= 12)) continue;
      if (RP.depr === 'zero' && d.remain !== 0) continue;
    }
    rows.push({ m, a, d, canc: c.stornoed.has(m.id) });
  }
  rows.sort((x, y) => x.m.operation_date.localeCompare(y.m.operation_date) || x.a.inventory_number.localeCompare(y.a.inventory_number) || x.m.seq - y.m.seq);
  return rows;
}

  body.querySelector('#bkLoad').onchange = ev => {
    const f = ev.target.files[0]; if (!f) return;
    const rd = new FileReader(); rd.onload = () => {
      try { const o = JSON.parse(rd.result); if (!Array.isArray(o.assets) || !Array.isArray(o.movements) || !Array.isArray(o.employees)) throw 0; if (!confirm('Заменить текущие данные данными из файла?')) return; S = o; S.audit = S.audit || []; R.sel.clear(); dirsChanged(); modal.close(); toast('Данные восстановлены'); }
      catch (e) { toast('Файл не является резервной копией системы', true); }
    }; rd.readAsText(f);
  };
  body.querySelector('#rst').onclick = () => { if (!confirm('Все текущие данные будут удалены. Продолжить?')) return; seed(); R.sel.clear(); dirsChanged(); modal.close(); closeDrawer(); toast('Загружены демо-данные'); };
}

/* ---------- Общее обновление ---------- */
function refreshAll() { renderKPI(); renderRegistry(); if (DR.id) renderDrawer(); renderReport(); }

/* ---------- События ---------- */
function bindEvents() {
  $('#logoIc').innerHTML = icon('laptop', 18); $('#gIc').innerHTML = icon('search'); $('#rqIc').innerHTML = icon('search');
  $('#btnNew').innerHTML = icon('plus') + ' Новый актив'; $('#filtToggle').innerHTML = icon('filter') + ' Фильтры';
  $('#exXlsx').innerHTML = icon('sheet') + ' Excel'; $('#exPdf').innerHTML = icon('file') + ' PDF'; $('#exCsv').innerHTML = icon('download') + ' CSV'; $('#exPrint').innerHTML = icon('printer') + ' Печать';
  $('#btnNew').onclick = openNewAsset;
  $('#navDirs').onclick = () => openDirs();
  $('#rq').addEventListener('input', e => { R.q = e.target.value; R.page = 1; renderRegistry(); });
  [['fCat', 'cat'], ['fStatus', 'status'], ['fMol', 'mol'], ['fDept', 'dept'], ['fLoc', 'loc']].forEach(([id, k]) => $('#' + id).addEventListener('change', e => { R[k] = e.target.value; R.page = 1; renderKPI(); renderRegistry(); }));
  $('#fReset').onclick = () => { Object.assign(R, { q: '', cat: '', status: '', mol: '', dept: '', loc: '', special: '', page: 1 }); $('#rq').value = ''; syncFilterControls(); renderKPI(); renderRegistry(); };
  $('#filtToggle').onclick = () => { const f = $('#filters'); f.classList.toggle('open'); $('#filtToggle').setAttribute('aria-expanded', String(f.classList.contains('open'))); };
  $('#kpi').addEventListener('click', e => {
    const b = e.target.closest('[data-kpi]'); if (!b) return;
    const [type, val] = b.dataset.kpi.split(':');
    if (type === 'status') { R.status = (val && R.status !== val) ? val : ''; if (!val) R.special = ''; }
    else R.special = R.special === val ? '' : val;
    R.page = 1; syncFilterControls(); renderKPI(); renderRegistry();
    $('#registry').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  const reg = $('#registry');
  reg.addEventListener('click', e => {
    const t = e.target;
    if (t.id === 'selAll') { const list = filteredAssets().slice((R.page - 1) * R.size, R.page * R.size); list.forEach(a => t.checked ? R.sel.add(a.id) : R.sel.delete(a.id)); renderRegistry(); return; }
    const sel = t.closest('[data-sel]'); if (sel) { sel.checked ? R.sel.add(sel.dataset.sel) : R.sel.delete(sel.dataset.sel); renderRegistry(); return; }
    if (t.closest('label.chk')) return;
    const mb = t.closest('[data-menu]'); if (mb) { e.stopPropagation(); openMenu(mb, mb.dataset.menu); return; }
    const so = t.closest('[data-sort]'); if (so) { const k = so.dataset.sort; if (R.sort === k) R.dir = -R.dir; else { R.sort = k; R.dir = 1; } renderRegistry(); return; }
    const bk = t.closest('[data-bulk]'); if (bk) { if (bk.dataset.bulk === 'clear') { R.sel.clear(); renderRegistry(); } else openBulk(bk.dataset.bulk); return; }
    const pg = t.closest('[data-page]'); if (pg) { R.page = +pg.dataset.page; renderRegistry(); return; }
    const ch = t.closest('[data-chip]'); if (ch) { R[ch.dataset.chip] = ''; syncFilterControls(); renderKPI(); renderRegistry(); return; }
    const row = t.closest('[data-open]'); if (row && !t.closest('input,button,select,a')) openAsset(row.dataset.open);
  });
  reg.addEventListener('keydown', e => { if (e.key === 'Enter') { const row = e.target.closest('[data-open]'); if (row && e.target === row) openAsset(row.dataset.open); } });
  reg.addEventListener('change', e => { if (e.target.id === 'pgSize') { R.size = +e.target.value; R.page = 1; renderRegistry(); } });
  $('#menu').addEventListener('click', e => { const b = e.target.closest('[data-mact]'); if (!b) return; const id = $('#menu').dataset.id; closeMenu(); b.dataset.mact === 'open' ? openAsset(id) : openOp(id, b.dataset.mact); });
  $('#menu').addEventListener('keydown', e => { if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const bs = [...$('#menu').querySelectorAll('button')]; const i = bs.indexOf(document.activeElement); bs[(i + (e.key === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length].focus(); } });
  document.addEventListener('click', e => { if (!e.target.closest('#menu')) closeMenu(); closeAllMsel(); if (!e.target.closest('.gsearch')) $('#gres').hidden = true; });
  window.addEventListener('scroll', closeMenu, true);
  window.addEventListener('resize', closeMenu);
  // Карточка
  $('#overlay').onclick = closeDrawer;
  $('#drawer').addEventListener('click', e => {
    if (e.target.closest('[data-drclose]')) return closeDrawer();
    const tb = e.target.closest('[data-tab]'); if (tb) { DR.tab = tb.dataset.tab; renderDrawer(); return; }
    const op = e.target.closest('[data-op]'); if (op) return openOp(DR.id, op.dataset.op);
    if (e.target.closest('[data-storno]')) openStorno(DR.id);
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    const mr = $('#modalRoot'); if (mr.lastElementChild) { mr.lastElementChild.close(); return; }
    if (!$('#menu').hidden) { closeMenu(); return; }
    if (DR.id) closeDrawer();
  });
  // Глобальный поиск (поддерживает USB-сканер: ввод + Enter)
  const gq = $('#gq'), gres = $('#gres');
  const gFind = q => { q = q.trim().toLowerCase(); if (!q) return []; return S.assets.filter(a => a.inventory_number.includes(q) || (a.serial_number || '').toLowerCase().includes(q)).sort((a, b) => ((b.inventory_number === q || (b.serial_number || '').toLowerCase() === q) - (a.inventory_number === q || (a.serial_number || '').toLowerCase() === q)) || a.inventory_number.localeCompare(b.inventory_number)).slice(0, 8); };
  gq.addEventListener('input', () => {
    const res = gFind(gq.value); if (!gq.value.trim()) { gres.hidden = true; return; }
    gres.innerHTML = res.length ? res.map(a => `<button type="button" data-gid="${a.id}"><span class="mono">${esc(a.inventory_number)}</span> · ${esc(a.name)}<div class="sub">${a.serial_number ? 'S/N ' + esc(a.serial_number) + ' · ' : ''}${STATUSES[a.status].label}</div></button>`).join('') : '<div class="empty">Ничего не найдено</div>';
    gres.hidden = false;
  });
  gq.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const r = gFind(gq.value); if (r[0]) { openAsset(r[0].id); gq.value = ''; gres.hidden = true; } else toast('Актив не найден', true); }
    if (e.key === 'ArrowDown') { const b = gres.querySelector('button'); if (b) { e.preventDefault(); b.focus(); } }
  });
  gres.addEventListener('click', e => { const b = e.target.closest('[data-gid]'); if (b) { openAsset(b.dataset.gid); gq.value = ''; gres.hidden = true; } });
  // Отчёт
  $('#rpFrom').addEventListener('change', e => { RP.from = e.target.value; RP.preset = ''; document.querySelectorAll('[data-preset]').forEach(b => b.setAttribute('aria-pressed', 'false')); renderReport(); });
  $('#rpTo').addEventListener('change', e => { RP.to = e.target.value; RP.preset = ''; document.querySelectorAll('[data-preset]').forEach(b => b.setAttribute('aria-pressed', 'false')); renderReport(); });
  $('#rpTo').max = TODAY; $('#rpFrom').max = TODAY;
  document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => { setPreset(b.dataset.preset); renderReport(); });
  $('#rpGo').onclick = () => { if (renderReport()) toast('Отчёт сформирован'); };
  [['rpDept', 'dept'], ['rpLoc', 'loc'], ['rpCat', 'cat'], ['rpDepr', 'depr']].forEach(([id, k]) => $('#' + id).addEventListener('change', e => { RP[k] = e.target.value; renderReport(); }));
  msel($('#rpTypes'), { options: USER_OPS.concat(['register', 'storno']).map(o => [o, OPS[o].label]), selected: RP.types, summary: s => s.size ? `Операции: ${s.size}` : 'Операции: все', onChange: reportChanged });
  msel($('#rpCols'), { options: RCOLS.map(c => [c.k, c.label, c.req]), selected: RP.visible, summary: () => 'Колонки', onChange: reportChanged });
  $('#exCsv').onclick = exportCsv; $('#exXlsx').onclick = exportXlsx; $('#exPdf').onclick = exportPdf; $('#exPrint').onclick = doPrint;
}

/* ---------- Запуск ---------- */
load();
buildRegHead();
bindEvents();
setPreset('month');
refreshFilterOptions();
renderKPI();
renderRegistry();
renderReport();
</script>
</body>
</html>
